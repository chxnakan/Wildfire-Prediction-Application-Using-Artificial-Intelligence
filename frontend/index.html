<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FireWatch Thailand</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔥%3C/text%3E%3C/svg%3E" />
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("fw.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-view="map">

<header class="topbar">
  <div class="brand">
    <button id="sidebarToggle" class="collapse-btn" type="button" data-i18n-title="nav.toggleSidebar" aria-label="Toggle sidebar">‹</button>
    <span class="brand-flame" aria-hidden="true">🔥</span>
    <span class="brand-name">FireWatch Thailand</span>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a class="tab" href="#map" data-view="map"><span class="tab-ico">🗺️</span><span class="tab-text" data-i18n="nav.map">Map</span></a>
    <a class="tab" href="#live" data-view="live"><span class="tab-ico">🔥</span><span class="tab-text" data-i18n="nav.live">Live Fires</span></a>
    <a class="tab" href="#analytics" data-view="analytics"><span class="tab-ico">📈</span><span class="tab-text" data-i18n="nav.analytics">Analytics</span></a>
    <a class="tab" href="#compare" data-view="compare"><span class="tab-ico">🆚</span><span class="tab-text" data-i18n="nav.compare">Predicted vs Actual</span></a>
    <a class="tab" href="#alerts" data-view="alerts"><span class="tab-ico">🔔</span><span class="tab-text" data-i18n="nav.alerts">Alerts</span></a>
    <a class="tab" href="#reports" data-view="reports"><span class="tab-ico">📊</span><span class="tab-text" data-i18n="nav.reports">Reports</span></a>
  </nav>
  <div class="top-actions">
    <button id="langToggle" class="round-btn" type="button" data-i18n-title="nav.language">EN</button>
    <button id="themeToggle" class="round-btn" type="button" data-i18n-title="nav.theme">🌙</button>
    <button id="livePill" class="live-pill" type="button" data-state="connecting"><span class="dot"></span><span id="livePillText">LIVE</span></button>
  </div>
</header>

<main>
  <section id="view-map" class="view" data-view="map">
    <aside id="sidebar" aria-label="Forecast controls"></aside>
    <div id="map" role="region" aria-label="Map"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section id="view-live" class="view page" data-view="live"><div class="page-inner" id="livePage"></div></section>
  <section id="view-analytics" class="view page" data-view="analytics"><div class="page-inner" id="analyticsPage"></div></section>
  <section id="view-compare" class="view page" data-view="compare"><div class="page-inner" id="comparePage"></div></section>
  <section id="view-alerts" class="view page" data-view="alerts"><div class="page-inner" id="alertsPage"></div></section>
  <section id="view-reports" class="view page" data-view="reports"><div class="page-inner" id="reportsPage"></div></section>
</main>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" type="button" id="modalClose" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<section id="liveNotification" class="card live-notification" aria-labelledby="liveNotificationTitle" hidden>
  <div class="live-notification-head">
    <div id="liveNotificationSummary" role="status" aria-live="polite" aria-atomic="true">
      <h2 id="liveNotificationTitle" class="card-title"></h2>
      <div id="liveNotificationLocation" class="card-sub"></div>
      <div id="liveNotificationTime" class="card-sub"></div>
    </div>
    <button id="liveNotificationClose" class="modal-close" type="button" aria-label="Dismiss notification">×</button>
  </div>
  <p id="liveNotificationNote" class="card-sub"></p>
  <div class="live-notification-actions">
    <button id="liveNotificationMap" class="btn sm primary" type="button"></button>
    <button id="liveNotificationDismiss" class="btn sm" type="button"></button>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/dist/leaflet-maplibre-gl.js" integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS" crossorigin="anonymous"></script>
<script src="basemap.js"></script>
<script src="i18n.js"></script>
<script src="geo.js"></script>
<script src="app.js"></script>
<script src="map.js"></script>
<script src="live.js"></script>
<script src="live_notifications.js"></script>
<script src="analytics.js"></script>
<script src="compare.js"></script>
<script src="alerts.js"></script>
<script src="reports.js"></script>
</body>
</html>
