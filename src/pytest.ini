[pytest]
# A hanging TestClient lifespan (observed on some FastAPI/Starlette/httpx
# combos) must FAIL with a thread dump, never hang CI. `thread` method works
# even when the hang is inside C/async code.
timeout = 60
timeout_method = thread
addopts = -q
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
