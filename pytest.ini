[pytest]
# Repo-root config so the hang-guard + test discovery work no matter the CWD
# (running `pytest` from the root previously used no timeout). A hung
# TestClient lifespan now fails with a thread dump instead of hanging.
testpaths = src/tests
timeout = 60
timeout_method = thread
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
