# Railway deployment config
#
# Setup checklist (one-time, in the Railway dashboard):
#   1. New Project → Deploy from GitHub repo
#   2. Add a PostgreSQL service → DATABASE_URL is injected automatically
#   3. Add a Volume mounted at /data (persists model + FIRMS cache across deploys)
#   4. Set service variables:
#        FIRMS_API_KEY   = <your NASA FIRMS map key>          (required)
#        OUTPUT_DIR      = /data/outputs
#        FIRMS_PATH      = /data/firms/firms_all.parquet
#        RAW_DIR         = /data/raw
#        ADMIN_TOKEN     = <random secret for /api/admin/* endpoints>
#      Optional tuning:
#        SYNC_INTERVAL_MINUTES = 10
#        RETRAIN_EVERY_DAYS    = 3
#        TRAIN_ARGS            = --quick
#        PREDICT_MAX_HISTORY_DAYS = 180
#
# The API boots in degraded mode when the volume is empty (no model yet);
# the scheduler then accumulates FIRMS data and trains automatically.

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd src && uvicorn api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
